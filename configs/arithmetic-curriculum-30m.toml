format_version = 1

[run]
id = "arithmetic-curriculum-30m"
artifact_dir = "artifacts/arithmetic-curriculum-30m"
description = "Bounded arithmetic tutor trained from scratch on a deterministic verified curriculum."
allow_network = false

[corpus]
manifest_path = "data/arithmetic-curriculum/manifest.json"
restricted_to_manifest = true
enforce_manifest_split_only = false
near_duplicate_mode = "exact_only"

[corpus.split]
method = "conversation_id_sha256_mod"
train = 0.98
validation = 0.01
test = 0.01

[tokenizer]
type = "restricted_bpe"
vocab_size = 1024
min_frequency = 2
character_policy = "reject"
normalization = "nfc"
allowed_characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~\n"
merge_digits = false
special_tokens = ["<|pad|>", "<|unk|>", "<|bos|>", "<|eos|>", "<|system|>", "<|user|>", "<|assistant|>", "<|end|>"]

[dataset]
max_seq_len = 128
packing = "fixed_block"
loss_mask = "assistant_only"
drop_remainder = true

[model]
architecture = "decoder_only_causal_transformer"
vocab_size = 1024
max_seq_len = 128
n_layers = 8
d_model = 512
n_heads = 8
n_kv_heads = 8
d_ff = 1536
norm = "rmsnorm"
mlp = "swiglu"
rope_base = 10000.0
dropout = 0.0
tie_embeddings = true
init_std = 0.02
residual_init_scale = "deepnorm-lite"
parameter_cap = 500000000

[training]
device = "cuda"
precision = "bfloat16"
allow_precision_fallback = false
total_steps = 2000
micro_batch_size = 16
gradient_accumulation_steps = 8
drop_last = true
max_grad_norm = 1.0

[training.optimizer]
name = "adamw"
learning_rate = 0.0003
betas = [0.9, 0.95]
eps = 0.00000001
weight_decay = 0.1

[training.scheduler]
name = "warmup_cosine"
warmup_steps = 100
min_learning_rate = 0.00003

[checkpointing]
interval_steps = 100
keep_last = 3
atomic = true
strict_resume = true

[evaluation]
interval_steps = 100
eval_at_step_zero = true
metrics = ["loss", "perplexity", "assistant_token_accuracy", "arithmetic_exact_match"]

[generation]
max_new_tokens = 24
temperature = 0.01
top_k = 1
top_p = 1.0
repetition_penalty = 1.0

[seeds]
corpus_split = 3101
tokenizer = 3102
dataset = 3103
model = 3104
dataloader = 3105
generation = 3106
