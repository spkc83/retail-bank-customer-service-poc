[run]
name = "banking-tool-sft-qwen35"
description = "Guarded banking-v3 tool-use SFT challenger for Qwen3.5 9B."
format = "banking_v3_tool_sft_config"
hub_dest = "spkc83/retail-bank-agent-9b-qwen35"
private_hub_repo = false
push_to_hub_default = false

[model]
base_model = "Qwen/Qwen3.5-9B"
base_revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
family = "qwen35"
parameter_tier = "literal_9b_challenger"

[dataset]
name = "data/banking-v3-tool-sft/manifest.json"
schema_version = "banking-tool-sft/v1"
tool_manifest = "public_banking_poc_nine_tools"
task = "model_owned_banking_tool_use_sft"

[training]
stack = "trl_sfttrainer_peft_bf16_lora"
precision = "bf16"
max_train_seconds = 14400
max_wallclock_hours = 5
checkpoint_every_steps = 250
merge_adapter = true
push_to_hub = false

[lora]
r = 32
alpha = 64
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
