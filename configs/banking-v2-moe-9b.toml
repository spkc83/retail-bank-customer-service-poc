[run]
name = "banking-v2-moe-9b"
description = "Guarded Qwen2-MoE SFT/domain-adaptation plan for banking-services chat."
format = "banking_v2_cloud_job_config_not_v1_experiment_schema"
hub_dest = "spkc83/hello-banking-moe-9b"
private_hub_repo = true

[model]
base_model = "Qwen/Qwen2.5-1.5B-Instruct"
base_revision = "989aa7980e4cf806f80c7fef2b1adb7bc71aa306"
architecture = "qwen2_moe"
vocab_size = 151936
hidden_size = 1536
num_hidden_layers = 28
num_attention_heads = 12
num_key_value_heads = 2
intermediate_size = 8960
shared_expert_intermediate_size = 8960
moe_intermediate_size = 2048
num_experts = 28
num_experts_per_tok = 2
norm_topk_prob = true
output_router_logits = true
router_aux_loss_coef = 0.01
rope_theta = 1000000.0
use_sliding_window = false
tie_word_embeddings = true
qkv_bias = true
total_parameters = 8943713792
estimated_active_parameters = 2073443840

[conversion]
dense_non_mlp = "copy"
shared_expert_gate_proj = "copy_dense_gate_proj"
shared_expert_up_proj = "copy_dense_up_proj"
shared_expert_down_proj = "two_times_dense_down_proj"
shared_expert_gate = "zeros"
routed_gate_up = "deterministic_2048_row_slices_plus_noise"
routed_down = "zeros"
router = "deterministic_small_random_nonzero_normal"
pre_update_logit_equivalence_atol = 1e-5

[dataset]
name = "data/banking-v2/manifest.json"
source = "prepared_banking_v2_bitext_composition"
router_eval_name = "PolyAI/banking77"
router_eval_revision = "90d4e2ee5521c04fc1488f065b8b083658768c57"
task = "banking_services_multiturn_sft"
system_prompt = "You are a banking-services assistant. Answer only financial-services questions."
out_of_domain_stock_response = "I can only help with retail banking and financial-services questions. Please ask about accounts, cards, transfers, payments, loans, or related banking support."

[training]
scope = "sft_domain_adaptation_not_from_scratch_pretraining"
mostly_frozen_base = true
train_router = true
train_routed_down_residuals = true
freeze_routed_gate_up = true
precision = "bf16"
fsdp = "single_process_disabled"
hardware = "rtx-pro-6000"
activation_checkpointing = true
checkpoint_every_steps = 250
resume_validation = true
resume_hash_checks = [
  "base_model_revision",
  "dataset_revision",
  "converted_state_manifest_sha256",
  "optimizer_scheduler_rng_state",
]
max_wallclock_hours = 5
max_budget_usd = 13.75

[expert_health]
warmup_steps = 250
gate_interval_steps = 250
observation_window_steps = 50
exclude_padded_tokens = true
min_assignment_fraction = 0.005
max_assignment_fraction = 0.20
min_normalized_entropy = 0.75
require_finite_aux_loss = true
require_routed_down_nonzero_grad = true

[packages]
torch = ">=2.9,<3"
transformers = ">=5.13,<5.14"
accelerate = ">=1.12,<2"
datasets = ">=4.4,<5"
peft = ">=0.18,<0.19"
trl = ">=0.26,<0.27"
