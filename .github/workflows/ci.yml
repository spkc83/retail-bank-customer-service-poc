name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src scripts tests poc/retail-bank-customer-service-poc
      - run: python -m pytest tests/test_banking_*.py poc/retail-bank-customer-service-poc/tests
      - run: python -m mypy src scripts tests
      - run: bash -n scripts/banking_v2/quantize_local_gguf.sh
