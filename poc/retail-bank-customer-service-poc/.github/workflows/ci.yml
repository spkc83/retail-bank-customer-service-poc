name: POC verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest ruff
      - run: pytest
        env:
          DEMO_AUTH_JSON: >-
            {"alex.demo":"alex-ci-password","maya.demo":"maya-ci-password"}
          POC_SKIP_MODEL_LOAD: "1"
          POC_SKIP_ROUTER_LOAD: "1"
      - run: ruff check .
      - run: python -m py_compile *.py
