[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-slm"
version = "0.1.0"
description = "Executable specification and minimal from-scratch restricted-corpus SLM trainer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.18",
  "torch>=2.2",
]

[project.optional-dependencies]
app = [
  "shiny>=1.5,<2",
]
data = [
  "pyarrow>=16",
]
scale = [
  "accelerate>=1.12,<2",
  "datasets>=4.4,<5",
  "huggingface-hub>=1.4,<2",
  "peft>=0.18,<0.19",
  "safetensors>=0.6,<1",
  "transformers>=5.13,<5.14",
  "trl>=0.26,<0.27",
]
dev = [
  "gradio==5.49.1",
  "mypy>=1.10",
  "pyarrow>=16",
  "pytest>=8",
  "ruff>=0.5",
  "shiny>=1.5,<2",
]

[project.scripts]
hello-slm = "hello_slm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hello_slm = ["arithmetic_chat.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "poc/retail-bank-customer-service-poc/tests"]
pythonpath = ["src", "poc/retail-bank-customer-service-poc"]

[tool.mypy]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["shiny", "shiny.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
  "accelerate",
  "accelerate.*",
  "datasets",
  "datasets.*",
  "peft",
  "peft.*",
  "transformers",
  "transformers.*",
  "trl",
  "trl.*",
]
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
